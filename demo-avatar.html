<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduClass v2 - Phòng Thay Đồ Mascot (Responsive Desktop & Mobile)</title>
  <style>
    :root {
      --bg-cream: #FFF9F0;
      --primary-blue: #4F8CFF;
      --primary-yellow: #FFB020;
      --primary-green: #2ECC8F;
      --primary-red: #FF6B6B;
      --primary-purple: #9B6BFF;
      --text-dark: #1E293B;
      --text-muted: #64748B;
      --card-bg: #FFFFFF;
      --border-color: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #F1F5F9;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* Container chính: Tự động chuyển đổi giữa Mobile và Desktop */
    .app-container {
      width: 100%;
      max-width: 400px;
      height: 740px;
      background: var(--bg-cream);
      border-radius: 36px;
      box-shadow: 0 20px 40px -15px rgba(0,0,0,0.12), 0 0 0 8px #FFFFFF, 0 0 0 10px #CBD5E1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      transition: all 0.3s ease;
    }

    /* BỐ CỤC MÁY TÍNH (DESKTOP - Bố cục 2 cột rộng rãi) */
    @media (min-width: 768px) {
      .app-container {
        max-width: 860px;
        height: 560px;
        border-radius: 28px;
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15), 0 0 0 10px #FFFFFF;
      }

      .main-body {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      .stage {
        flex: 0 0 42% !important;
        border-right: 2px solid #F1E7D8;
      }

      .customizer {
        flex: 1 !important;
        border-top-left-radius: 0 !important;
        border-top-right-radius: 0 !important;
        padding: 20px 24px !important;
      }

      .item-grid {
        grid-template-columns: repeat(4, 1fr) !important;
        gap: 12px !important;
      }
    }

    /* Header */
    .app-header {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid #F1E7D8;
      z-index: 10;
    }

    .header-btn {
      background: #FFFFFF;
      border: 1.5px solid #CBD5E1;
      border-radius: 12px;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .header-btn:hover { background: #F8FAFC; border-color: #94A3B8; }
    .header-btn.save {
      background: var(--primary-green);
      color: white;
      border-color: #27AE60;
      box-shadow: 0 3px 10px rgba(46, 204, 143, 0.35);
    }
    .header-btn.save:active { transform: scale(0.96); }

    .header-title {
      font-size: 18px;
      font-weight: 800;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .main-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Vùng hiển thị nhân vật (Stage) */
    .stage {
      flex: 1.1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: radial-gradient(circle at center, #FFFFFF 0%, #FFF3E0 100%);
      overflow: hidden;
    }

    .stage-pedestal {
      position: absolute;
      bottom: 24px;
      width: 200px;
      height: 40px;
      background: #EADBCC;
      border-radius: 50%;
      box-shadow: 0 10px 20px rgba(180, 130, 90, 0.2), inset 0 2px 4px #FFFFFF;
      z-index: 1;
    }
    .stage-pedestal::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 10px;
      right: 10px;
      height: 26px;
      background: #F5E8D8;
      border-radius: 50%;
    }

    .avatar-wrapper {
      width: 220px;
      height: 220px;
      z-index: 2;
      position: relative;
      margin-bottom: 12px;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .avatar-wrapper.bounce {
      transform: scale(1.08) translateY(-6px);
    }

    .random-btn {
      position: absolute;
      bottom: 14px;
      right: 16px;
      background: #FFFFFF;
      border: 1.5px solid #FED7AA;
      border-radius: 20px;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 800;
      color: #EA580C;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.15);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 5;
      transition: all 0.15s;
    }
    .random-btn:hover { background: #FFF7ED; transform: translateY(-1px); }
    .random-btn:active { transform: scale(0.95); }

    .tag-unlocked-all {
      position: absolute;
      top: 14px;
      left: 16px;
      background: rgba(255, 255, 255, 0.95);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1.5px solid #E2E8F0;
      font-size: 12px;
      font-weight: 800;
      color: var(--primary-green);
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      z-index: 5;
    }

    /* Khu vực tùy biến (Customizer) */
    .customizer {
      flex: 1.25;
      background: var(--card-bg);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      padding: 16px 14px;
      z-index: 10;
    }

    /* Thanh Tabs cuộn ngang */
    .tabs-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      scrollbar-width: none;
    }
    .tabs-bar::-webkit-scrollbar { display: none; }

    .tab-item {
      padding: 8px 16px;
      background: #F1F5F9;
      border: 1.5px solid transparent;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab-item:hover { background: #E2E8F0; }
    .tab-item.active {
      background: #EFF6FF;
      color: var(--primary-blue);
      border-color: var(--primary-blue);
      box-shadow: 0 2px 8px rgba(79, 140, 255, 0.2);
    }

    /* Lưới danh sách Item */
    .item-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      overflow-y: auto;
      padding: 4px 2px 10px;
    }

    .grid-card {
      background: #FAFAFA;
      border: 2px solid #E2E8F0;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 6px;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
      min-height: 88px;
    }
    .grid-card:hover {
      background: #F8FAFC;
      border-color: #CBD5E1;
      transform: translateY(-2px);
    }
    .grid-card.active {
      background: #F0FDF4;
      border-color: var(--primary-green);
      box-shadow: 0 4px 12px rgba(46, 204, 143, 0.25);
    }

    .card-icon {
      font-size: 28px;
      margin-bottom: 4px;
    }
    .card-title {
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      text-align: center;
      line-height: 1.2;
    }

    /* Toast thông báo */
    .toast {
      position: absolute;
      top: 64px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #0F172A;
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 100;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Modal xem JSON DB */
    .json-modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 200;
    }
    .json-modal.open { display: flex; }
    .modal-content {
      background: white;
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.2);
    }
    .modal-title { font-size: 17px; font-weight: 800; margin-bottom: 8px; color: #1E293B; }
    .modal-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
    .json-pre {
      background: #0F172A;
      color: #38BDF8;
      padding: 14px;
      border-radius: 14px;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <!-- Khung Responsive (Tự chuyển 1 cột trên Mobile, 2 cột trên Desktop) -->
  <div class="app-container">
    
    <!-- Toast Popup -->
    <div id="toast" class="toast">✨ Đã lưu diện mạo mới!</div>

    <!-- Header -->
    <header class="app-header">
      <button class="header-btn" onclick="alert('Đóng phòng thay đồ')">❮ Quay lại</button>
      <div class="header-title">👗 Phòng Thay Đồ Mascot</div>
      <button class="header-btn save" onclick="saveAvatar()">Lưu Diện Mạo ✓</button>
    </header>

    <div class="main-body">
      <!-- Cột 1: Sân khấu hiển thị Mascot (Stage) -->
      <section class="stage">
        <div class="tag-unlocked-all">
          <span>🔓 Đã mở khóa tất cả trang phục</span>
        </div>

        <div class="stage-pedestal"></div>

        <!-- Cụm SVG xếp lớp (Layered SVG 200x200) -->
        <div class="avatar-wrapper" id="avatarBox">
          <svg id="mascotSvg" viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15" />
              </filter>
            </defs>

            <!-- LAYER 0: CÁNH SAU -->
            <g id="layer-wings-back"></g>

            <!-- LAYER 1: THÂN CƠ BẢN -->
            <g id="layer-base"></g>

            <!-- LAYER 2: BIỂU CẢM KHUÔN MẶT -->
            <g id="layer-face"></g>

            <!-- LAYER 3: TRANG PHỤC / ÁO -->
            <g id="layer-top"></g>

            <!-- LAYER 4: MŨ / PHỤ KIỆN ĐẦU -->
            <g id="layer-hat"></g>

            <!-- LAYER 5: CẦM TAY -->
            <g id="layer-held"></g>
          </svg>
        </div>

        <button class="random-btn" onclick="randomize()">🎲 Đổi ngẫu nhiên</button>
      </section>

      <!-- Cột 2: Khu vực tùy biến (Tabs + Lưới đồ) -->
      <section class="customizer">
        <div class="tabs-bar" id="tabsBar"></div>
        <div class="item-grid" id="itemGrid"></div>
      </section>
    </div>

    <!-- Modal xem JSON DB -->
    <div class="json-modal" id="jsonModal">
      <div class="modal-content">
        <div class="modal-title">💾 Chuỗi JSON lưu trong SQLite</div>
        <div class="modal-desc">Lưu trực tiếp vào cột <code>students.avatar_json</code> (~120 bytes):</div>
        <pre class="json-pre" id="jsonOutput"></pre>
        <button class="header-btn save" style="width: 100%; justify-content: center;" onclick="closeModal()">Đã hiểu & Đóng</button>
      </div>
    </div>

  </div>

      none: '',
      angel: `
        <g fill="#F0F9FF" stroke="#38BDF8" stroke-width="2" opacity="0.95">
          <path d="M 68,118 C 30,90 20,120 28,140 C 34,152 50,150 68,136 Z" />
          <path d="M 66,128 C 44,110 38,132 44,144 Z" fill="#BAE6FD" />
          <path d="M 132,118 C 170,90 180,120 172,140 C 166,152 150,150 132,136 Z" />
          <path d="M 134,128 C 156,110 162,132 156,144 Z" fill="#BAE6FD" />
        </g>
      `,
      bat: `
        <g fill="#7C3AED" stroke="#5B21B6" stroke-width="2">
          <path d="M 68,118 C 35,95 24,115 22,126 C 36,134 48,134 50,146 C 58,140 64,136 68,132 Z" />
          <path d="M 132,118 C 165,95 176,115 178,126 C 164,134 152,134 150,146 C 142,140 136,136 132,132 Z" />
        </g>
      `
    };

    // 1.6 ĐỒ CẦM TAY (HELD)
    const HELD = {
      none: '',
      pencil: `
        <g transform="translate(140, 105) rotate(22)">
          <rect x="0" y="0" width="12" height="42" fill="#FACC15" stroke="#CA8A04" stroke-width="1.5" />
          <polygon points="0,0 12,0 6,-14" fill="#FDE68A" />
          <polygon points="4,-9 8,-9 6,-14" fill="#1E293B" />
          <rect x="0" y="34" width="12" height="8" fill="#F472B6" />
        </g>
      `,
      wand: `
        <g transform="translate(138, 108) rotate(18)">
          <rect x="4" y="0" width="4" height="42" fill="#94A3B8" rx="2" />
          <polygon points="6,-6 9,2 17,2 11,8 13,16 6,11 -1,16 1,8 -5,2 3,2" fill="#F59E0B" stroke="#D97706" stroke-width="1.5" />
          <circle cx="6" cy="5" r="2" fill="#FFFFFF" />
        </g>
      `
    };

    // ==========================================
    // 2. STATE VÀ DANH MỤC (TẤT CẢ ĐÃ MỞ KHÓA)
    // ==========================================
    let currentAvatar = {
      base: 'bear',
      face: 'smile',
      top: 'uniform',
      hat: 'straw',
      wings: 'angel',
      held: 'pencil'
    };

    // Tất cả reqLevel = 0 để mở khóa tự do trước mắt cho mọi học sinh
    const CATALOG = {
      base: {
        title: '🐻 Nhân vật',
        items: [
          { id: 'bear', name: 'Gấu Nâu', icon: '🐻', reqLevel: 0 },
          { id: 'cat', name: 'Mèo Vàng', icon: '🐱', reqLevel: 0 },
          { id: 'rabbit', name: 'Thỏ Trắng', icon: '🐰', reqLevel: 0 }
        ]
      },
      face: {
        title: '😊 Biểu cảm',
        items: [
          { id: 'smile', name: 'Mắt Cười', icon: '😄', reqLevel: 0 },
          { id: 'wink', name: 'Nháy Mắt', icon: '😉', reqLevel: 0 },
          { id: 'glasses', name: 'Chăm Ngoan', icon: '🤓', reqLevel: 0 }
        ]
      },
      top: {
        title: '👕 Trang phục',
        items: [
          { id: 'none', name: 'Mặc định', icon: '🚫', reqLevel: 0 },
          { id: 'uniform', name: 'Đồng Phục', icon: '🧣', reqLevel: 0 },
          { id: 'tshirt', name: 'Áo Thun', icon: '👕', reqLevel: 0 },
          { id: 'hoodie', name: 'Áo Hoodie', icon: '🧥', reqLevel: 0 }
        ]
      },
      hat: {
        title: '🧢 Mũ Nón',
        items: [
          { id: 'none', name: 'Không đội', icon: '🚫', reqLevel: 0 },
          { id: 'straw', name: 'Nón Lá', icon: '👒', reqLevel: 0 },
          { id: 'cap', name: 'Lưỡi Trai', icon: '🧢', reqLevel: 0 },
          { id: 'crown', name: 'Vương Miện', icon: '👑', reqLevel: 0 }
        ]
      },
      wings: {
        title: '🪽 Đôi Cánh',
        items: [
          { id: 'none', name: 'Không cánh', icon: '🚫', reqLevel: 0 },
          { id: 'angel', name: 'Thiên Thần', icon: '🪽', reqLevel: 0 },
          { id: 'bat', name: 'Tiểu Quỷ', icon: '🦇', reqLevel: 0 }
        ]
      },
      held: {
        title: '🪄 Cầm tay',
        items: [
          { id: 'none', name: 'Tay không', icon: '🚫', reqLevel: 0 },
          { id: 'pencil', name: 'Bút Chì To', icon: '✏️', reqLevel: 0 },
          { id: 'wand', name: 'Đũa Thần', icon: '🪄', reqLevel: 0 }
        ]
      }
    };

    let activeCategory = 'base';

    // ==========================================
    // 3. RENDER LOGIC
    // ==========================================
    function renderAvatar() {
      document.getElementById('layer-wings-back').innerHTML = WINGS[currentAvatar.wings] || '';
      document.getElementById('layer-base').innerHTML = BASES[currentAvatar.base] || BASES.bear;
      document.getElementById('layer-face').innerHTML = FACES[currentAvatar.face] || FACES.smile;
      document.getElementById('layer-top').innerHTML = TOPS[currentAvatar.top] || '';
      document.getElementById('layer-hat').innerHTML = HATS[currentAvatar.hat] || '';
      document.getElementById('layer-held').innerHTML = HELD[currentAvatar.held] || '';

      const box = document.getElementById('avatarBox');
      box.classList.remove('bounce');
      void box.offsetWidth;
      box.classList.add('bounce');
    }

    function renderTabs() {
      const tabsBar = document.getElementById('tabsBar');
      tabsBar.innerHTML = '';
      
      Object.keys(CATALOG).forEach(catKey => {
        const cat = CATALOG[catKey];
        const btn = document.createElement('button');
        btn.className = `tab-item ${catKey === activeCategory ? 'active' : ''}`;
        btn.innerHTML = cat.title;
        btn.onclick = () => {
          activeCategory = catKey;
          renderTabs();
          renderGrid();
        };
        tabsBar.appendChild(btn);
      });
    }

    function renderGrid() {
      const grid = document.getElementById('itemGrid');
      grid.innerHTML = '';
      const categoryData = CATALOG[activeCategory];

      categoryData.items.forEach(item => {
        const isSelected = currentAvatar[activeCategory] === item.id;
        const card = document.createElement('div');
        card.className = `grid-card ${isSelected ? 'active' : ''}`;
        
        card.innerHTML = `
          <div class="card-icon">${item.icon}</div>
          <div class="card-title">${item.name}</div>
        `;

        card.onclick = () => {
          currentAvatar[activeCategory] = item.id;
          renderAvatar();
          renderGrid();
        };

        grid.appendChild(card);
      });
    }

    function randomize() {
      const randomFrom = (arr) => arr[Math.floor(Math.random() * arr.length)];
      currentAvatar = {
        base: randomFrom(CATALOG.base.items.map(i => i.id)),
        face: randomFrom(CATALOG.face.items.map(i => i.id)),
        top: randomFrom(CATALOG.top.items.map(i => i.id)),
        hat: randomFrom(CATALOG.hat.items.map(i => i.id)),
        wings: randomFrom(CATALOG.wings.items.map(i => i.id)),
        held: randomFrom(CATALOG.held.items.map(i => i.id))
      };

      renderAvatar();
      renderGrid();
      showToast('🎲 Đã ngẫu nhiên phối đồ!');
    }

    function saveAvatar() {
      const jsonStr = JSON.stringify(currentAvatar, null, 2);
      document.getElementById('jsonOutput').innerText = jsonStr;
      document.getElementById('jsonModal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('jsonModal').classList.remove('open');
      showToast('✨ Đã lưu diện mạo mới vào hồ sơ học sinh!');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    renderTabs();
    renderGrid();
    renderAvatar();
  </script>
</body>
</html>
